name: Continuous Integration
on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read
  actions: read
  checks: write

concurrency: # Auto-cancel existing runs in the PR when a new commit is pushed
  group: run-tests-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  check-go-mod-sync:
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check go.mod consistency between root and tests/
        run: |
          fail=0

          check() {
            local name="$1" root="$2" tests="$3"
            if [ "$root" != "$tests" ]; then
              echo "MISMATCH: $name"
              echo "  go.mod:       $root"
              echo "  tests/go.mod: $tests"
              fail=1
            else
              echo "OK: $name ($root)"
            fi
          }

          check "go version" \
            "$(grep '^go ' go.mod | awk '{print $2}')" \
            "$(grep '^go ' tests/go.mod | awk '{print $2}')"

          check "go.temporal.io/api" \
            "$(grep 'go\.temporal\.io/api ' go.mod | awk '{print $2}')" \
            "$(grep 'go\.temporal\.io/api ' tests/go.mod | awk '{print $2}')"

          check "go.temporal.io/server" \
            "$(grep 'go\.temporal\.io/server ' go.mod | awk '{print $2}')" \
            "$(grep 'go\.temporal\.io/server ' tests/go.mod | awk '{print $2}')"

          exit $fail

  unit-test:
    permissions:
      contents: read
    runs-on: ubuntu-24.04-arm
    env:
      TEST_OUTPUT_ROOT: ${{ github.workspace }}/reports
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: "go.mod"

      - name: Run Unit Tests
        env:
          REPORT: "true"
        run: make unit-test

      - name: Unit Test Report
        uses: dorny/test-reporter@a43b3a5f7366b97d083190328d2c652e1a8b6aa2 # v3.0.0
        if: ${{ !cancelled() && github.event.pull_request.head.repo.full_name == github.repository }} # Prevent running in fork PRs due to `checks: write`
        with:
          name: Unit Tests
          path: ${{ env.TEST_OUTPUT_ROOT }}/unit-report.json
          reporter: golang-json

      - name: Archive code coverage results
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: unit-code-coverage
          path: ${{ env.TEST_OUTPUT_ROOT }}/unit-coverage.out

  unit-code-coverage:
    name: "Unit test coverage report"
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository # Do not run when workflow is triggered by push to main branch or is from a fork
    runs-on: ubuntu-latest
    needs: unit-test
    permissions:
      contents: read
      actions: read
      pull-requests: write
    steps:
      - uses: fgrosse/go-coverage-report@e432de98ee94a276e8f666d25bfd76347665f75b # v1.3.1
        with:
          coverage-artifact-name: "unit-code-coverage"
          coverage-file-name: "unit-coverage.out"

  integration-test:
    runs-on: ubuntu-24.04-arm
    env:
      TEST_OUTPUT_ROOT: ${{ github.workspace }}/reports
      # Server testcore writes to $TEMPORAL_ROOT/.testoutput; default resolves into
      # the read-only module cache when server is a dependency.
      TEMPORAL_ROOT: ${{ github.workspace }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: "tests/go.mod"

      - name: Run Integration Tests
        env:
          REPORT: "true"
        run: make integration-test

      - name: Integration Test Report
        uses: dorny/test-reporter@a43b3a5f7366b97d083190328d2c652e1a8b6aa2 # v3.0.0
        if: ${{ !cancelled() && github.event.pull_request.head.repo.full_name == github.repository }}
        with:
          name: Integration Tests
          path: ${{ env.TEST_OUTPUT_ROOT }}/integration-report.json
          reporter: golang-json

      - name: Archive code coverage results
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: integ-code-coverage
          path: ${{ env.TEST_OUTPUT_ROOT }}/integration-coverage.out

  integ-code-coverage:
    name: "Integration test coverage report"
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository # Do not run when workflow is triggered by push to main branch or is from a fork
    runs-on: ubuntu-latest
    needs: integration-test
    permissions:
      contents: read
      actions: read
      pull-requests: write # write permission needed to comment on PR
    steps:
      - uses: fgrosse/go-coverage-report@e432de98ee94a276e8f666d25bfd76347665f75b # v1.3.1
        with:
          coverage-artifact-name: "integ-code-coverage"
          coverage-file-name: "integration-coverage.out"
