name: Continuous Integration
on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read
  actions: read
  checks: write

concurrency: # Auto-cancel existing runs in the PR when a new commit is pushed
  group: run-tests-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  check-go-mod-sync:
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check go.mod consistency between root and tests/
        run: |
          fail=0

          check() {
            local name="$1" root="$2" tests="$3"
            if [ "$root" != "$tests" ]; then
              echo "MISMATCH: $name"
              echo "  go.mod:       $root"
              echo "  tests/go.mod: $tests"
              fail=1
            else
              echo "OK: $name ($root)"
            fi
          }

          check "go version" \
            "$(grep '^go ' go.mod | awk '{print $2}')" \
            "$(grep '^go ' tests/go.mod | awk '{print $2}')"

          check "go.temporal.io/api" \
            "$(grep 'go\.temporal\.io/api ' go.mod | awk '{print $2}')" \
            "$(grep 'go\.temporal\.io/api ' tests/go.mod | awk '{print $2}')"

          check "go.temporal.io/server" \
            "$(grep 'go\.temporal\.io/server ' go.mod | awk '{print $2}')" \
            "$(grep 'go\.temporal\.io/server ' tests/go.mod | awk '{print $2}')"

          exit $fail

  unit-test:
    permissions:
      contents: read
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: "go.mod"

      - name: Run Unit Tests
        run: make unit-test-report

      - name: Unit Test Report
        uses: dorny/test-reporter@v3
        if: ${{ !cancelled() && github.event.pull_request.head.repo.full_name == github.repository }} # Prevent running in fork PRs due to `checks: write`
        with:
          name: Unit Tests
          path: ./report.json
          reporter: golang-json

      - name: Archive code coverage results
        uses: actions/upload-artifact@v4
        with:
          name: unit-code-coverage
          path: coverage.out

  unit-code-coverage:
    name: "Unit test coverage report"
    if: github.event_name == 'pull_request' # Do not run when workflow is triggered by push to main branch
    runs-on: ubuntu-latest
    needs: unit-test
    permissions:
      contents:      read
      actions:       read
      pull-requests: write
    steps:
      - uses: fgrosse/go-coverage-report@v1.3.0
        with:
          coverage-artifact-name: "unit-code-coverage"
          coverage-file-name: "coverage.out"

  integration-test:
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: "tests/go.mod"

      - name: Run Integration Tests
        working-directory: tests
        # Server testcore writes to $TEMPORAL_ROOT/.testoutput; default resolves into
        # the read-only module cache when server is a dependency.
        env:
          TEMPORAL_ROOT: ${{ github.workspace }}
        run: go test -v -json -cover -coverprofile=../coverage.out -tags=test_dep -timeout 300s ./integration/... > ../integ-report.json

      - name: Integration Test Report
        uses: dorny/test-reporter@v3
        if: ${{ !cancelled() && github.event.pull_request.head.repo.full_name == github.repository }}
        with:
          name: Integration Tests
          path: ./integ-report.json
          reporter: golang-json

      - name: Archive code coverage results
        uses: actions/upload-artifact@v4
        with:
          name: integ-code-coverage
          path: coverage.out

  integ-code-coverage:
    name: "Integration test coverage report"
    if: github.event_name == 'pull_request' # Do not run when workflow is triggered by push to main branch
    runs-on: ubuntu-latest
    needs: integration-test
    permissions:
      contents:      read
      actions:       read
      pull-requests: write # write permission needed to comment on PR
    steps:
      - uses: fgrosse/go-coverage-report@v1.3.0
        with:
          coverage-artifact-name: "integ-code-coverage"
          coverage-file-name: "coverage.out"

  integration-test-server-main:
    continue-on-error: true
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: "tests/go.mod"

      - name: Update server to main
        working-directory: tests
        run: |
          go get go.temporal.io/server@main
          go mod tidy

      - name: Run Integration Tests
        working-directory: tests
        env:
          TEMPORAL_ROOT: ${{ github.workspace }}
        run: go test -tags=test_dep -timeout 300s ./integration/...
