name: Continuous Integration
on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read
  actions: read

concurrency: # Auto-cancel existing runs in the PR when a new commit is pushed
  group: run-tests-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  unit-test:
    permissions:
      contents: read
      checks: write
      statuses: write
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: "go.mod"

      - name: Run Unit Tests
        env:
          UNIT_TEST_FLAGS: -v -cover
        run: make unit-test

  integration-test:
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: "tests/go.mod"

      - name: Run Integration Tests
        working-directory: tests
        run: go test -tags=test_dep -timeout 300s ./integration/...

  integration-test-server-main:
    continue-on-error: true
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: "tests/go.mod"

      - name: Update server to main
        working-directory: tests
        run: |
          go get go.temporal.io/server@main
          go mod tidy

      - name: Run Integration Tests
        working-directory: tests
        run: go test -tags=test_dep -timeout 300s ./integration/...
