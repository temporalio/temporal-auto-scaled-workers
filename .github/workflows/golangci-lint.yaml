name: Linting
on:
  pull_request:
  # Called by release-auto-tag.yml as a release gate, before it pushes a tag.
  workflow_call:
    inputs:
      ref:
        description: 'Commit, branch, or tag to lint (empty = the triggering ref)'
        required: false
        type: string

permissions:
  contents: read

jobs:
  golangci:
    name: lint
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Empty means "the ref for the triggering event", so pull_request is
          # unaffected; only workflow_call sets this.
          ref: ${{ inputs.ref }}
          fetch-depth: 0
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: stable
      - name: golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.12
          # PRs lint only what they changed; a release gate lints the whole tree,
          # and base.sha does not exist off a pull_request event anyway.
          args: ${{ github.event_name == 'pull_request' && format('--new-from-rev={0}', github.event.pull_request.base.sha) || '' }}
