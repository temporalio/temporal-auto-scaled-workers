syntax = "proto3";

package temporal.auto_scaled_workers.wci.workflow.compute_provider.nexus;

import "temporal/api/common/v1/message.proto";

option go_package = "go.temporal.io/auto-scaled-workers/wci/workflow/compute_provider/nexus;nexus";

message RequestContext {
  string namespace = 1;
  string deployment_name = 2;
  string build_id = 3;
}

message ValidateConfigInput {
  RequestContext request_context = 1;
  temporal.api.common.v1.Payload config = 2;
}

message ValidateConfigOutput {}
