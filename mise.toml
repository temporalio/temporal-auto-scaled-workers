[tools]
go = "1.27.0"
golangci-lint = "2.12.2"
actionlint = "1.7.12"
shellcheck = "0.11.0" # actionlint shell-lints `run:` blocks only when this is on PATH

# Integration tests live under ./tests and require the test_dep build tag
# (compute-observer spy hooks). Don't set TEMPORAL_ROOT here: suite-scoped clusters
# (see tests/integration/suite_test.go) load schema/sqlite/v3 from testcore's
# GetRepoRootDirectory(), which only resolves correctly via its GOMODCACHE fallback
# (this repo doesn't vendor the server's schema files) — TEMPORAL_ROOT would point
# schema lookup at this repo's checkout instead and fail to find schema.sql.
# Extra args are appended, e.g. `mise run integration -- -run TestWCIWorkerSet`.
[tasks.integration]
description = "Run WCI integration tests (in-process Temporal server)"
dir = "tests"
run = "go test -tags=test_dep -timeout 300s ./integration/..."

[tasks.lint-branch]
description = "Lint changes since the merge-base with main"
run = "make lint-branch"
